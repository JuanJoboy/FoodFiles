[tools]
flutter = "3.44.6" # Forces mise to always download the newest version, but strictly limits it to 3.x releases
java = "corretto-17" # Forces mise to fetch the newest Java 17 release without jumping to Java 21+
supabase = "latest"
# python = "latest"

[env]
# Injects environment variables directly into your terminal session automatically
SUPABASE_URL = "http://localhost:54321"

[tasks]
# mise exec -- COMMAND is also useful
# Shortcut to spin up your local containers
up = "supabase start"
# Shortcut to stop containers and clear system RAM memory
down = "supabase stop"
# Outputs active API ports, database connection keys, and states
status = "supabase status"
# Rebuilds database layout cleanly matching your migrations folder
reset = "supabase db reset"